<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hospital Admin Login</title>

<style>

*{
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0d47a1,#1976d2);
}

.login-box{
    width:380px;
    max-width:90%;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 10px 30px rgba(0,0,0,.3);
}

h2{
    text-align:center;
    color:#0d47a1;
    margin-bottom:25px;
}

label{
    display:block;
    font-weight:bold;
    margin-top:15px;
}

input{
    width:100%;
    padding:12px;
    margin-top:7px;
    border:1px solid #ccc;
    border-radius:6px;
}

button{
    width:100%;
    padding:12px;
    margin-top:20px;
    border:none;
    border-radius:6px;
    background:#0077b6;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#023e8a;
}

.home{
    background:#6c757d;
}

.message{
    text-align:center;
    margin-top:15px;
    font-weight:bold;
}

</style>

</head>

<body>

<div class="login-box">

<h2>🏥 Hospital Admin Login</h2>

<label>Username</label>

<input
    type="text"
    id="username"
    placeholder="Enter admin username"
>

<label>Password</label>

<input
    type="password"
    id="password"
    placeholder="Enter admin password"
>

<button onclick="login()">
Admin Login
</button>

<button
    class="home"
    onclick="window.location.href='index.html'">

🏠 Back to Home

</button>

<div
    class="message"
    id="message">
</div>

</div>


<script>

/* =====================================================
   ADMIN LOGIN
===================================================== */

function login(){

    const username =
        document.getElementById("username")
        .value
        .trim();

    const password =
        document.getElementById("password")
        .value;

    const message =
        document.getElementById("message");


    /* =================================================
       ADMIN USERNAME & PASSWORD
    ================================================= */

    if(
        username === "admin" &&
        password === "admin123"
    ){

        /*
           IMPORTANT:
           sessionStorage is used.

           Admin access will remain only
           during the current browser session.
        */

        sessionStorage.setItem(
            "currentUser",
            JSON.stringify({

                id:"ADMIN",

                username:"admin",

                role:"admin"

            })
        );


        message.style.color="green";

        message.innerText =
            "✅ Admin Login Successful.";


        /*
           Go to Home page
        */

        setTimeout(function(){

            window.location.href =
                "index.html";

        },500);

    }

    else{

        message.style.color="red";

        message.innerText =
            "❌ Invalid Admin Login.";

    }

}


/* =====================================================
   ENTER KEY LOGIN
===================================================== */

document.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            login();

        }

    }
);

</script>

</body>

</html>
