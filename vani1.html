/* =====================================================
   DATE FUNCTIONS
===================================================== */

function formatDate(date){

    return (
        date.getFullYear() +
        "-" +
        String(date.getMonth() + 1).padStart(2,"0") +
        "-" +
        String(date.getDate()).padStart(2,"0")
    );

}


function getToday(){

    return formatDate(new Date());

}



/* =====================================================
   TIME FUNCTIONS
===================================================== */

function convertTime(time){

    const parts =
        time.trim().split(" ");

    const hm =
        parts[0].split(":");

    let hour =
        parseInt(hm[0],10);

    const minute =
        parseInt(hm[1],10);


    if(parts[1] === "PM" && hour !== 12){

        hour += 12;

    }


    if(parts[1] === "AM" && hour === 12){

        hour = 0;

    }


    return hour * 60 + minute;

}



function minutesToTime(minutes){

    /*
       1440 = midnight
    */

    if(minutes === 1440){

        minutes = 0;

    }


    let hour =
        Math.floor(minutes / 60);

    const minute =
        minutes % 60;


    const ampm =
        hour >= 12 ? "PM" : "AM";


    let displayHour =
        hour % 12;


    if(displayHour === 0){

        displayHour = 12;

    }


    return (
        String(displayHour).padStart(2,"0") +
        ":" +
        String(minute).padStart(2,"0") +
        " " +
        ampm
    );

}



/* =====================================================
   ROUND TIME TO NEXT 30 MINUTES
===================================================== */

function next30MinuteSlot(minutes){

    return Math.ceil(minutes / 30) * 30;

}



/* =====================================================
   GET ALL APPOINTMENTS FROM FIRESTORE
===================================================== */

async function getAppointments(){

    try{

        const snapshot =
            await db
            .collection("appointments")
            .get();


        const appointments = [];


        snapshot.forEach(doc => {

            const data =
                doc.data();


            appointments.push({

                id: doc.id,

                doctor:
                    data.doctor ||
                    data["Doctor"] ||
                    data.doctorName ||
                    "",

                date:
                    data.date ||
                    data.appointmentDate ||
                    data["Appointment Date"] ||
                    "",

                appointmentTime:
                    data.appointmentTime ||
                    data.time ||
                    data["Appointment Time"] ||
                    "",

                status:
                    data.status ||
                    "Booked"

            });

        });


        console.log(
            "Firestore appointments:",
            appointments
        );


        return appointments;

    }

    catch(error){

        console.error(
            "Firestore READ ERROR:",
            error
        );

        throw error;

    }

}



/* =====================================================
   CHECK WHETHER SLOT IS BOOKED
===================================================== */

function isSlotBooked(
    doctorName,
    date,
    slot,
    appointments
){

    return appointments.some(appointment => {

        const sameDoctor =
            String(
                appointment.doctor || ""
            ).trim().toLowerCase()
            ===
            String(
                doctorName || ""
            ).trim().toLowerCase();


        const sameDate =
            String(
                appointment.date || ""
            ).trim()
            ===
            String(date).trim();


        const sameTime =
            String(
                appointment.appointmentTime || ""
            ).trim()
            ===
            String(slot).trim();


        const status =
            String(
                appointment.status || "Booked"
            )
            .trim()
            .toLowerCase();


        /*
           Cancelled appointments should free the slot.
        */

        const cancelled =
            status.includes("cancel");


        if(
            sameDoctor &&
            sameDate &&
            sameTime &&
            !cancelled
        ){

            return true;

        }


        return false;

    });

}



/* =====================================================
   FIND FREE SLOT FOR ONE DATE
===================================================== */

function getFreeSlotForDate(
    doctorName,
    doctorAvailableTime,
    date,
    appointments
){

    const times =
        doctorAvailableTime.split(" - ");


    let start =
        convertTime(times[0]);


    let end =
        convertTime(times[1]);


    /*
       12:00 AM means midnight/end of day.
    */

    if(end === 0){

        end = 1440;

    }


    /*
       If this is TODAY,
       skip past appointment times.
    */

    if(date === getToday()){

        const now =
            new Date();


        const currentMinutes =
            now.getHours() * 60 +
            now.getMinutes();


        start =
            Math.max(
                start,
                next30MinuteSlot(
                    currentMinutes
                )
            );

    }


    /*
       Doctor's working time already finished.
       Return null.

       findNextAvailableSlot()
       will automatically check tomorrow.
    */

    if(start >= end){

        return null;

    }


    /*
       Check every 30-minute slot.
    */

    for(
        let time = start;
        time < end;
        time += 30
    ){

        const slot =
            minutesToTime(time);


        const booked =
            isSlotBooked(
                doctorName,
                date,
                slot,
                appointments
            );


        if(!booked){

            return slot;

        }

    }


    /*
       All slots on this date are booked.
    */

    return null;

}



/* =====================================================
   FIND NEXT AVAILABLE SLOT
===================================================== */

async function findNextAvailableSlot(
    doctorName,
    doctorAvailableTime
){

    /*
       Read Firestore ONCE.
    */

    const appointments =
        await getAppointments();


    /*
       Start from TODAY.
    */

    const startDate =
        new Date();


    /*
       Search for 365 days.
    */

    for(
        let day = 0;
        day < 365;
        day++
    ){

        const checkDate =
            new Date(startDate);


        checkDate.setDate(
            startDate.getDate() + day
        );


        const date =
            formatDate(checkDate);


        const freeTime =
            getFreeSlotForDate(

                doctorName,

                doctorAvailableTime,

                date,

                appointments

            );


        /*
           Slot found.
        */

        if(freeTime){

            console.log(
                "NEXT AVAILABLE SLOT:",
                doctorName,
                date,
                freeTime
            );


            return {

                date: date,

                time: freeTime

            };

        }

    }


    /*
       No slot for 365 days.
    */

    return null;

}

/* =====================================================
   FIND DOCTOR
===================================================== */

async function findDoctor(){

    const disease =
        document
        .getElementById("disease")
        .value;


    const department =
        document
        .getElementById("department");


    const doctor =
        document
        .getElementById("doctor");


    const doctorTime =
        document
        .getElementById("doctorTime");


    const appointmentTime =
        document
        .getElementById("appointmentTime");


    const date =
        document
        .getElementById("date");


    /*
       Clear old values.
    */

    department.value = "";

    doctor.value = "";

    doctorTime.value = "";

    appointmentTime.value = "";

    date.value = getToday();


    if(!disease){

        return;

    }


    try{

        showFinding();


        let result = null;



        /* =================================================
           EMERGENCY
        ================================================= */

        if(
            disease ===
            "Emergency Problem"
        ){

            const now =
                new Date();


            const currentMinutes =
                now.getHours() * 60 +
                now.getMinutes();


            if(currentMinutes < 480){

                result =
                    doctors.find(
                        d =>
                        d[2] ===
                        "Dr. Rajesh Kumar"
                    );

            }

            else if(
                currentMinutes < 960
            ){

                result =
                    doctors.find(
                        d =>
                        d[2] ===
                        "Dr. Priyanka Reddy"
                    );

            }

            else{

                result =
                    doctors.find(
                        d =>
                        d[2] ===
                        "Dr. Karthik Rao"
                    );

            }

        }



        /* =================================================
           NORMAL DISEASE
        ================================================= */

        else{

            const matchingDoctors =
                doctors.filter(
                    d =>
                    d[0] === disease
                );


            /*
               Only one doctor.
            */

            if(
                matchingDoctors.length === 1
            ){

                result =
                    matchingDoctors[0];

            }


            /*
               Multiple doctors.
            */

            else if(
                matchingDoctors.length > 1
            ){

                const now =
                    new Date();


                const currentMinutes =
                    now.getHours() * 60 +
                    now.getMinutes();


                /*
                   First try doctor currently working.
                */

                result =
                    matchingDoctors.find(
                        d => {

                            const times =
                                d[3]
                                .split(" - ");


                            let start =
                                convertTime(
                                    times[0]
                                );


                            let end =
                                convertTime(
                                    times[1]
                                );


                            if(end === 0){

                                end = 1440;

                            }


                            return (
                                currentMinutes >= start &&
                                currentMinutes < end
                            );

                        }
                    );


                /*
                   If nobody is working,
                   use first doctor and search
                   next available date.
                */

                if(!result){

                    result =
                        matchingDoctors[0];

                }

            }

        }



        /*
           No doctor found.
        */

        if(!result){

            appointmentTime.value = "";

            date.value = "";

            return;

        }



        /*
           Show doctor information.
        */

        department.value =
            result[1];


        doctor.value =
            result[2];


        doctorTime.value =
            result[3];



        /*
           FIND NEXT FREE SLOT

           TODAY
             ↓
           TOMORROW
             ↓
           NEXT DAY
             ↓
           NEXT DAY
             ↓
           ...
           365 DAYS
        */

        const slot =
            await findNextAvailableSlot(

                result[2],

                result[3]

            );



        if(slot){

            date.value =
                slot.date;


            appointmentTime.value =
                slot.time;

        }

        else{

            date.value = "";

            appointmentTime.value =
                "No Slots Available";

        }

    }

    catch(error){

        console.error(
            "SLOT CALCULATION ERROR:",
            error
        );


        appointmentTime.value = "";

        date.value = "";


        alert(

            "❌ Could not calculate appointment slot.\n\n" +

            "Error: " +
            error.message

        );

    }

}



/* =====================================================
   BOOK APPOINTMENT
===================================================== */

async function bookAppointment(){

    const appointment = {

        name:
            document
            .getElementById("name")
            .value
            .trim(),


        phone:
            document
            .getElementById("phone")
            .value
            .trim(),


        disease:
            document
            .getElementById("disease")
            .value,


        department:
            document
            .getElementById("department")
            .value,


        doctor:
            document
            .getElementById("doctor")
            .value,


        doctorTime:
            document
            .getElementById("doctorTime")
            .value,


        appointmentTime:
            document
            .getElementById(
                "appointmentTime"
            )
            .value,


        date:
            document
            .getElementById("date")
            .value,


        status:
            "Booked"

    };



    /* =================================================
       PATIENT DETAILS VALIDATION
    ================================================= */

    if(
        !appointment.name ||
        !appointment.phone ||
        !appointment.disease
    ){

        alert(
            "Please enter patient details"
        );

        return;

    }



    /* =================================================
       SLOT VALIDATION
    ================================================= */

    if(

        !appointment.doctor ||

        !appointment.appointmentTime ||

        appointment.appointmentTime ===
        "Finding slot..." ||

        appointment.appointmentTime ===
        "No Slots Available" ||

        !appointment.date

    ){

        alert(
            "No appointment slot available"
        );

        return;

    }



    try{

        /*
           Read latest Firestore data
           before saving.
        */

        const appointments =
            await getAppointments();



        /*
           Check whether selected slot
           was booked by somebody else.
        */

        const alreadyBooked =
            isSlotBooked(

                appointment.doctor,

                appointment.date,

                appointment.appointmentTime,

                appointments

            );



        if(alreadyBooked){

            alert(

                "This slot was just booked.\n\n" +

                "Finding the next available slot."

            );


            await findDoctor();

            return;

        }



        /* =================================================
           SAVE APPOINTMENT TO FIRESTORE
        ================================================= */

        const docRef =
            await db
            .collection("appointments")
            .add(appointment);



        console.log(
            "Appointment saved:",
            docRef.id
        );



        /* =================================================
           SUCCESS MESSAGE
        ================================================= */

        alert(

            "✅ Appointment Booked Successfully\n\n" +

            "Patient: " +
            appointment.name +

            "\nDoctor: " +
            appointment.doctor +

            "\nAppointment Time: " +
            appointment.appointmentTime +

            "\nAppointment Date: " +
            appointment.date

        );



        /*
           Clear patient details.
        */

        document
        .getElementById("name")
        .value = "";


        document
        .getElementById("phone")
        .value = "";



        /*
           Automatically find next slot.
        */

        await findDoctor();

    }

    catch(error){

        console.error(
            "FIRESTORE SAVE ERROR:",
            error
        );


        alert(

            "❌ Appointment save failed.\n\n" +

            error.message

        );

    }

}
