// Convert time to minutes

function convertToMinutes(time){


let parts=time.split(" ");

let hm=parts[0].split(":");

let hour=parseInt(hm[0]);

let minute=parseInt(hm[1]);

let period=parts[1];


if(period=="PM" && hour!=12){
hour+=12;
}


if(period=="AM" && hour==12){
hour=0;
}


return hour*60+minute;


}




function updateDoctors(){


let tbody=document.getElementById("doctorTable");


tbody.innerHTML="";


let now=new Date();


let currentMinutes=
now.getHours()*60+now.getMinutes();



doctors.forEach((doc,index)=>{


let start=
convertToMinutes(doc.start);


let end=
convertToMinutes(doc.end);

let status;

if (start <= end) {
    // Normal timing
    status = currentMinutes >= start && currentMinutes <= end;
} else {
    // Overnight timing (example: 04:00 PM - 12:00 AM)
    status = currentMinutes >= start || currentMinutes <= end;
}





tbody.innerHTML+=`

<tr>

<td>${index+1}</td>

<td>${doc.name}</td>

<td>${doc.department}</td>

<td>${doc.phone}</td>

<td>${doc.start} - ${doc.end}</td>


<td class="${status?'available':'notavailable'}">

${status?'🟢 Available':'🔴 Not Available'}

</td>


</tr>


`;



});


}
