<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Patient Management</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f4f7fc;
    margin:0;
    padding:20px;
}

.container{
    width:95%;
    max-width:1400px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:10px;
    box-shadow:0 0 10px gray;
    box-sizing:border-box;
}

h2{
    text-align:center;
    color:#0d6efd;
    margin-bottom:25px;
}

button{
    padding:10px 15px;
    background:#0077b6;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
    margin:5px;
}

button:hover{
    background:#023e8a;
}

.search-box{
    width:100%;
    padding:10px;
    margin:10px 0 20px;
    box-sizing:border-box;
    border:1px solid #ccc;
    border-radius:5px;
}

.total{
    font-size:18px;
    font-weight:bold;
    margin:15px 0;
    color:#333;
}

.notice{
    background:#eaf4ff;
    padding:12px;
    border-radius:5px;
    margin-bottom:15px;
    color:#333;
}

.table-container{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:1100px;
}

th{
    background:#0077b6;
    color:white;
    padding:10px;
    border:1px solid #ddd;
}

td{
    padding:10px;
    border:1px solid #ddd;
    text-align:center;
}

tr:nth-child(even){
    background:#f8f9fa;
}

.delete-btn{
    background:#dc3545;
}

.delete-btn:hover{
    background:#b02a37;
}

.status{
    font-weight:bold;
}

</style>

</head>


<body>


<div class="container">


<button onclick="window.location.href='index.html'">
🏠 Home
</button>


<h2>
👨‍⚕️ Patient Management
</h2>


<div class="notice">
View Only - Only Admin can delete patients.
</div>


<input
    type="text"
    id="searchInput"
    class="search-box"
    placeholder="Search Patient Name"
    oninput="searchPatient()"
>


<div class="total">
Total Patients: <span id="totalPatients">0</span>
</div>


<div class="table-container">


<table>

<thead>

<tr>

<th>S.No</th>

<th>Patient Name</th>

<th>Phone</th>

<th>Disease</th>

<th>Department</th>

<th>Doctor</th>

<th>Doctor Time</th>

<th>Appointment Time</th>

<th>Date</th>

<th>Status</th>

<th>Action</th>

</tr>

</thead>


<tbody id="patientTableBody">

</tbody>


</table>


</div>


</div>


<!-- =====================================================
     FIREBASE FIRESTORE
===================================================== -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>


<script>


/* =====================================================
   FIREBASE CONFIG

   IMPORTANT:
   Put the SAME Firebase config that you use
   in your Appointment page.
===================================================== */

const firebaseConfig = {
    apiKey: "AIzaSyAjjzBZJaLq2B_omm62eHMYYcvaPAB3Gy0",
    authDomain: "hospital-management-syst-e5bef.firebaseapp.com",
    projectId: "hospital-management-syst-e5bef",
    storageBucket: "hospital-management-syst-e5bef.firebasestorage.app",
    messagingSenderId: "774381537399",
    appId: "1:774381537399:web:d6bad35fdf10eca6cf5e72"
};


/* Initialize Firebase */

firebase.initializeApp(firebaseConfig);


/* Firestore */

const db = firebase.firestore();



/* =====================================================
   GLOBAL PATIENT DATA
===================================================== */

let allPatients = [];



/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

    if(value === null || value === undefined){
        return "";
    }

    return String(value)

        .replace(/&/g,"&amp;")

        .replace(/</g,"&lt;")

        .replace(/>/g,"&gt;")

        .replace(/"/g,"&quot;")

        .replace(/'/g,"&#039;");

}



/* =====================================================
   ADMIN CHECK
===================================================== */

function isAdmin(){

    let currentUser =
        JSON.parse(
            sessionStorage.getItem("currentUser")
        );

    return(
        currentUser &&
        currentUser.role &&
        currentUser.role
            .toLowerCase() === "admin"
    );

}



/* =====================================================
   GET STATUS
===================================================== */

function getStatus(status){

    if(!status){
        return "Pending";
    }


    let value =
        String(status).toLowerCase();


    if(
        value.includes("complete") ||
        value.includes("done")
    ){

        return "Completed";

    }


    if(
        value.includes("cancel")
    ){

        return "Cancelled";

    }


    if(
        value.includes("available")
    ){

        return "Available";

    }


    if(
        value.includes("book")
    ){

        return "Booked";

    }


    return "Pending";

}



/* =====================================================
   CONVERT FIRESTORE DOCUMENT
   INTO PATIENT OBJECT
===================================================== */

function convertPatient(doc){

    let data = doc.data();


    return {

        id: doc.id,


        name:
            data.name ||
            data.patientName ||
            data.patient ||
            data["Patient Name"] ||
            "Unknown",


        phone:
            data.phone ||
            data.patientPhone ||
            data.mobile ||
            data["Phone Number"] ||
            "N/A",


        disease:
            data.disease ||
            data.problem ||
            data.healthIssue ||
            data["Disease"] ||
            "N/A",


        department:
            data.department ||
            data.specialization ||
            data["Department"] ||
            "N/A",


        doctor:
            data.doctor ||
            data.doctorName ||
            data["Doctor"] ||
            "Not Assigned",


        doctorTime:
            data.doctorTime ||
            data.availableTime ||
            data["Doctor Time"] ||
            (
                data.start && data.end
                ?
                data.start + " - " + data.end
                :
                "N/A"
            ),


        appointmentTime:
            data.appointmentTime ||
            data.time ||
            data["Appointment Time"] ||
            "N/A",


        date:
            data.date ||
            data.appointmentDate ||
            data["Appointment Date"] ||
            "N/A",


        status:
            getStatus(
                data.status
            )

    };

}



/* =====================================================
   FIRESTORE REAL-TIME CONNECTION
===================================================== */

function loadPatients(){

    db.collection("appointments")

        .onSnapshot(

            function(snapshot){

                allPatients = [];


                snapshot.forEach(
                    function(doc){

                        allPatients.push(
                            convertPatient(doc)
                        );

                    }
                );


                displayPatients(
                    allPatients
                );

            },


            function(error){

                console.error(
                    "Firestore Error:",
                    error
                );


                alert(
                    "❌ Unable to load patients.\n\n" +
                    error.message
                );

            }

        );

}



/* =====================================================
   DISPLAY PATIENTS
===================================================== */

function displayPatients(list){

    let tableBody =
        document.getElementById(
            "patientTableBody"
        );


    tableBody.innerHTML = "";


    document.getElementById(
        "totalPatients"
    ).textContent = list.length;



    if(list.length === 0){

        tableBody.innerHTML = `

            <tr>

                <td colspan="11">

                    No Patients Found

                </td>

            </tr>

        `;

        return;

    }



    list.forEach(
        function(patient,index){

            let row =
                document.createElement("tr");


            row.innerHTML = `

                <td>
                    ${index + 1}
                </td>


                <td>
                    ${escapeHTML(patient.name)}
                </td>


                <td>
                    ${escapeHTML(patient.phone)}
                </td>


                <td>
                    ${escapeHTML(patient.disease)}
                </td>


                <td>
                    ${escapeHTML(patient.department)}
                </td>


                <td>
                    ${escapeHTML(patient.doctor)}
                </td>


                <td>
                    ${escapeHTML(patient.doctorTime)}
                </td>


                <td>
                    ${escapeHTML(patient.appointmentTime)}
                </td>


                <td>
                    ${escapeHTML(patient.date)}
                </td>


                <td class="status">
                    ${escapeHTML(patient.status)}
                </td>


                <td>

                    <button
                        class="delete-btn"
                        onclick='deletePatient(${JSON.stringify(patient.id)})'
                    >
                        Delete
                    </button>

                </td>

            `;


            tableBody.appendChild(row);

        }
    );

}



/* =====================================================
   SEARCH PATIENT NAME
===================================================== */

function searchPatient(){

    let searchValue =
        document.getElementById(
            "searchInput"
        )
        .value
        .toLowerCase()
        .trim();


    let filteredPatients =
        allPatients.filter(
            function(patient){

                return String(
                    patient.name
                )
                .toLowerCase()
                .includes(searchValue);

            }
        );


    displayPatients(
        filteredPatients
    );

}



/* =====================================================
   DELETE PATIENT
   FIRESTORE DOCUMENT DELETE
===================================================== */

async function deletePatient(patientId){


    /* Admin check */

    if(!isAdmin()){

        alert(
            "❌ Only Admin can delete patients."
        );

        return;

    }



    /* Find patient */

    let patient =
        allPatients.find(
            function(item){

                return item.id === patientId;

            }
        );


    if(!patient){

        alert(
            "❌ Patient not found."
        );

        return;

    }



    /* Confirmation */

    let confirmDelete =
        confirm(

            "Are you sure you want to delete this patient?\n\n" +

            "Patient: " +
            patient.name

        );


    if(!confirmDelete){

        return;

    }



    try{


        /* Delete Firestore document */

        await db

            .collection("appointments")

            .doc(patientId)

            .delete();



        alert(
            "✅ Patient deleted successfully."
        );


        /*
           No need to manually refresh.

           Firestore onSnapshot()
           automatically updates the table.
        */


    }

    catch(error){

        console.error(
            "Delete Error:",
            error
        );


        alert(

            "❌ Patient delete failed.\n\n" +

            error.message

        );

    }

}



/* =====================================================
   START PAGE
===================================================== */

loadPatients();


</script>


</body>

</html>
